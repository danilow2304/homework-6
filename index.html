<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plant Collection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>My Plant Collection</h1>
        <p>Explore my collection of plants.</p>
    </header>

    <main>

        <h2>Plant Statistics</h2>
        <div id="stats"></div>

        <h2>My Plants</h2>

        <div class="controls">
            <button onclick="showAllPlants()">All Plants</button>
            <button onclick="sortAlphabetically()">Sort A-Z</button>

            <select id="sunlight" onchange="filterBySunlight()">
                <option value="">Sunlight</option>
                <option value="Full Sun">Full Sun</option>
                <option value="Partial Shade">Partial Shade</option>
                <option value="Shade">Shade</option>
            </select>

            <select id="season" onchange="filterByBloomSeason()">
                <option value="">Bloom Season</option>
                <option value="Spring">Spring</option>
                <option value="Summer">Summer</option>
                <option value="Fall">Fall</option>
                <option value="Winter">Winter</option>
            </select>

            <select id="height" onchange="filterByHeight()">
                <option value="">Height</option>
                <option value="short">Short (under 0.5 m)</option>
                <option value="medium">Medium (0.5 to 1 m)</option>
                <option value="tall">Tall (over 1 m)</option>
            </select>
        </div>

        <div id="plantList"></div>

    </main>

    <script src="script.js"></script>
</body>
</html>
